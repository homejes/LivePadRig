name: Build Mac Plugins (VST3 & AU)

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧰 Setup JUCE Framework & Projucer
        run: |
          echo "Mengambil JUCE Framework..."
          git clone --depth 1 https://github.com/juce-framework/JUCE.git
          
          echo "Membangun Projucer..."
          cd JUCE/extras/Projucer/Builds/MacOSX
          xcodebuild -project Projucer.xcodeproj -configuration Release

      - name: ⚙️ Set Path Absolut JUCE via Python & Resave
        run: |
          PROJUCER="JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
          WORKSPACE_DIR="$(pwd)"
          ABS_MODULES_PATH="$WORKSPACE_DIR/JUCE/modules"
          
          echo "Mengatur path absolut ke: $ABS_MODULES_PATH"
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          modules_path = '$ABS_MODULES_PATH'
          tree = ET.parse('LivePadRig.jucer')
          root = tree.getroot()

          for modules in root.iter('MODULES'):
              for mod in modules.findall('MODULE'):
                  mod.set('path', modules_path)

          tree.write('LivePadRig.jucer', encoding='utf-8', xml_declaration=True)
          print('Path absolut berhasil disuntikkan!')
          "

          echo "Mengatur global search path JUCE..."
          $PROJUCER --set-global-search-path osx defaultJuceModulePath "$ABS_MODULES_PATH"
          
          echo "Menjalankan resave..."
          $PROJUCER --resave LivePadRig.jucer

      - name: 🔨 Build VST3 dan Component (AU)
        run: |
          cd Builds/MacOSX
          echo "Mulai proses build plugin utama di Xcode..."
          xcodebuild -project LivePadRig.xcodeproj -configuration Release

      - name: 📦 Upload Hasil Build (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LivePadRig-Mac-Plugins
          path: |
            Builds/MacOSX/build/Release/*.vst3
            Builds/MacOSX/build/Release/*.component
