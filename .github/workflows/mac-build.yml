name: Build Mac Plugins (VST3 & AU)

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧰 Setup JUCE & Build Projucer
        run: |
          echo "Mengambil JUCE Framework..."
          git clone --depth 1 https://github.com/juce-framework/JUCE.git
          
          echo "Membuat aplikasi Projucer untuk mesin Mac Cloud..."
          cd JUCE/extras/Projucer/Builds/MacOSX
          xcodebuild -project Projucer.xcodeproj -configuration Release
          
      - name: ⚙️ Fix Jucer Paths & Generate JuceLibraryCode
        run: |
          PROJUCER="JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
          JUCE_MODULES_PATH="$(pwd)/JUCE/modules"
          
          echo "Memperbaiki path modul di file LivePadRig.jucer menggunakan Python..."
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          tree = ET.parse('LivePadRig.jucer')
          root = tree.getroot()

          # Cari semua tag MODULES / module path dan arahkan ke path JUCE cloud
          modules_dir = os.path.abspath('JUCE/modules')
          for modules in root.iter('MODULES'):
              for mod in modules.findall('MODULE'):
                  # Update path jika diperlukan
                  pass
          
          # Cara paling aman di JUCE: set global search path lewat command line
          "
          
          echo "Mengatur global search path JUCE..."
          $PROJUCER --set-global-search-path osx defaultJuceModulePath "$JUCE_MODULES_PATH"
          
          echo "Menerbitkan ulang file project..."
          $PROJUCER --resave LivePadRig.jucer || echo "Melewati warning resave, melanjutkan build..."
          
      - name: 🔨 Build VST3 dan Component (AU)
        run: |
          cd Builds/MacOSX
          echo "Mulai proses build plugin utama..."
          xcodebuild -project LivePadRig.xcodeproj -configuration Release
          
      - name: 📦 Upload Hasil Build (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LivePadRig-Mac-Plugins
          path: |
            Builds/MacOSX/build/Release/*.vst3
            Builds/MacOSX/build/Release/*.component
