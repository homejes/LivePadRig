name: Build Mac Plugins v1.1 (VST3 & AU)

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧰 Setup JUCE Framework & Build Projucer
        run: |
          echo "Mengambil JUCE Framework..."
          git clone --depth 1 https://github.com/juce-framework/JUCE.git
          
          echo "Membangun Projucer..."
          cd JUCE/extras/Projucer/Builds/MacOSX
          xcodebuild -project Projucer.xcodeproj -configuration Release

      - name: ⚙️ Suntik Path Module Paksa & Resave
        run: |
          python3 -c "
          import re
          with open('LivePadRig.jucer', 'r') as f:
              data = f.read()
          data = re.sub(r'(<MODULEPATH[^>]*path=\")[^\"]*(\")', r'\g<1>JUCE/modules\2', data)
          data = re.sub(r'(<MODULE [^>]*path=\")[^\"]*(\")', r'\g<1>JUCE/modules\2', data)
          with open('LivePadRig.jucer', 'w') as f:
              f.write(data)
          "
          PROJUCER="JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
          $PROJUCER --resave LivePadRig.jucer

      - name: 🔨 Build VST3 dan Component (AU)
        run: |
          cd Builds/MacOSX
          xcodebuild -project LivePadRig.xcodeproj -configuration Release

      - name: 📦 Buat Paket Installer macOS v1.1
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p LivePadRig_macOS_v1.1
          cp -R Builds/MacOSX/build/Release/*.vst3 LivePadRig_macOS_v1.1/
          cp -R Builds/MacOSX/build/Release/*.component LivePadRig_macOS_v1.1/
          cp "LIVEPAD RIG USER MANUAL.pdf" LivePadRig_macOS_v1.1/ 2>/dev/null || true
          cp -R Audio LivePadRig_macOS_v1.1/ 2>/dev/null || true
          
          if [ -f "Install_LivePadRig.command" ]; then
              cp Install_LivePadRig.command LivePadRig_macOS_v1.1/
              sed -i '' $'s/\r$//' LivePadRig_macOS_v1.1/Install_LivePadRig.command
              chmod +x LivePadRig_macOS_v1.1/Install_LivePadRig.command
          fi
          
          zip -r LivePadRig_macOS_v1.1.zip LivePadRig_macOS_v1.1/

      - name: 🚀 Upload Artifact macOS v1.1
        uses: actions/upload-artifact@v4
        with:
          name: LivePadRig_macOS_v1.1
          path: LivePadRig_macOS_v1.1.zip
