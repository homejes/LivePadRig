name: Attach macOS PKG to Release v1.3.1

on:
  push:
    branches: [ main ]

jobs:
  attach-pkg:
    # Hanya berjalan bila commit marker [attach-pkg] ada di pesan commit teratas.
    if: contains(github.event.head_commit.message, '[attach-pkg]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unduh artifact PKG dari build mac v1.3.1 lalu upload ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 43150515482 --repo $GITHUB_REPOSITORY --dir dl
          PKG=$(find dl -name "LivePadRig_Installer_v1.3.1.pkg" | head -n 1)
          test -n "$PKG"
          gh release upload v1.3.1 "$PKG" --clobber --repo $GITHUB_REPOSITORY
          gh release view v1.3.1 --repo $GITHUB_REPOSITORY --json assets --jq '.assets[].name'
